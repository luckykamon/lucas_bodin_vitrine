name: Deploy Node.js app to server

on:
  push:
    branches:
      - main

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Copy files to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST_LWS_SERVER }}
          username: ${{ secrets.USERNAME_LWS_SERVER }}
          password: ${{ secrets.PASSWORD_LWS_SERVER }}
          source: "."
          target: "/srv/lucasbodin"

      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_LWS_SERVER }}
          username: ${{ secrets.USERNAME_LWS_SERVER }}
          password: ${{ secrets.PASSWORD_LWS_SERVER }}
          script: |
            cd /srv/lucasbodin
            npm i
            npm run build
